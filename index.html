<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>for you</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">


<style>
/* ==========================================================================
   MAIN.CSS — design tokens + core layout
   ========================================================================== */

:root {
  /* -- palette ------------------------------------------------------- */
  --ink:          #0A0C10;   /* primary background — warm near-black */
  --ink-soft:     #10131A;   /* secondary panels */
  --ink-raised:   #161A23;
  --ivory:        #F4EEE3;   /* primary text */
  --ivory-dim:    #B9B2A4;   /* secondary text */
  --ivory-faint:  #6E695F;   /* tertiary / disabled */
  --brass:        #B8935F;   /* accent — used sparingly, on purpose */
  --brass-dim:    #7C6644;
  --rose-ash:     #C08776;   /* secondary warm accent — rare use */
  --line:         rgba(244, 238, 227, 0.12);
  --line-strong:  rgba(244, 238, 227, 0.22);
  --overlay:      rgba(6, 7, 10, 0.72);

  /* -- type ------------------------------------------------------------ */
  --f-display: 'Fraunces', 'Iowan Old Style', 'Georgia', serif;
  --f-body:    'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --f-mono:    'IBM Plex Mono', 'SFMono-Regular', ui-monospace, monospace;

  /* -- rhythm ------------------------------------------------------- */
  --edge: clamp(20px, 6vw, 56px);
  --section-pad: clamp(72px, 14vh, 140px);
  --radius: 2px; /* deliberately restrained — this is not a rounded-card design */

  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  --ease-soft: cubic-bezier(0.4, 0, 0.2, 1);
  --dur-fast: 320ms;
  --dur-med: 640ms;
  --dur-slow: 1100ms;
}

/* -- reset ---------------------------------------------------------------- */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }

html {
  background: var(--ink);
  color-scheme: dark;
  -webkit-tap-highlight-color: transparent;
}

body {
  font-family: var(--f-body);
  background: var(--ink);
  color: var(--ivory);
  font-size: 16px;
  line-height: 1.6;
  overflow-x: hidden;
  min-height: 100svh;
}

img, video { max-width: 100%; display: block; }
button { font-family: inherit; }
a { color: inherit; }

::selection { background: var(--brass-dim); color: var(--ivory); }

/* -- utility --------------------------------------------------------- */
.sr-only {
  position: absolute; width: 1px; height: 1px;
  padding: 0; margin: -1px; overflow: hidden;
  clip: rect(0,0,0,0); white-space: nowrap; border: 0;
}

.svg-icon { width: 22px; height: 22px; color: var(--ivory-dim); display: block; }
.svg-icon svg { width: 100%; height: 100%; }

button.bare {
  background: none; border: none; color: inherit; cursor: pointer;
  padding: 0; -webkit-appearance: none; appearance: none;
}

/* -- background atmosphere ------------------------------------------- */
.grain {
  position: fixed; inset: 0; z-index: 2; pointer-events: none;
  opacity: 0.035; mix-blend-mode: overlay;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
}

.vignette {
  position: fixed; inset: 0; z-index: 1; pointer-events: none;
  background: radial-gradient(ellipse at 50% 30%, transparent 40%, rgba(0,0,0,0.55) 130%);
}

/* -- progress ledger (signature element) ------------------------------
   A thin stitched line running down the page, like a bound journal
   spine, with a marker at each chapter reached. This is the one
   recurring visual motif tying the whole experience together.        */
.ledger {
  position: fixed;
  left: 14px;
  top: 0;
  bottom: 0;
  width: 20px;
  z-index: 40;
  display: none;
  pointer-events: none;
}
@media (min-width: 720px) {
  .ledger { display: block; }
}
.ledger-line {
  position: absolute;
  left: 9px; top: 8%; bottom: 8%;
  width: 1px;
  background: linear-gradient(to bottom, transparent, var(--line-strong) 10%, var(--line-strong) 90%, transparent);
}
.ledger-fill {
  position: absolute;
  left: 9px; top: 8%; width: 1px; height: 0%;
  background: var(--brass);
  transition: height 120ms linear;
}

/* -- top bar --------------------------------------------------------- */
.topbar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 50;
  display: flex; align-items: center; justify-content: space-between;
  padding: 18px var(--edge);
  pointer-events: none;
  mix-blend-mode: normal;
}
.topbar > * { pointer-events: auto; }
.topbar-btn {
  display: flex; align-items: center; gap: 8px;
  font-family: var(--f-mono); font-size: 11px; letter-spacing: 0.12em;
  text-transform: uppercase; color: var(--ivory-dim);
  transition: color var(--dur-fast) var(--ease-soft);
}
.topbar-btn:hover, .topbar-btn:focus-visible { color: var(--ivory); }
.topbar-btn .svg-icon { width: 18px; height: 18px; }

/* -- overlay panels (nav / letters) ----------------------------------- */
.panel {
  position: fixed; inset: 0; z-index: 90;
  background: var(--ink);
  transform: translateY(4%);
  opacity: 0;
  visibility: hidden;
  transition: opacity var(--dur-med) var(--ease-out), transform var(--dur-med) var(--ease-out), visibility 0s var(--dur-med);
  overflow-y: auto;
  padding: 88px var(--edge) 64px;
}
.panel.is-open {
  opacity: 1; visibility: visible; transform: translateY(0);
  transition: opacity var(--dur-med) var(--ease-out), transform var(--dur-med) var(--ease-out);
}
.panel-close {
  position: fixed; top: 18px; right: var(--edge); z-index: 95;
}
.panel-eyebrow {
  font-family: var(--f-mono); font-size: 11px; letter-spacing: 0.14em;
  text-transform: uppercase; color: var(--brass); margin-bottom: 10px;
}
.panel-title {
  font-family: var(--f-display); font-weight: 500; font-size: clamp(28px, 6vw, 44px);
  margin: 0 0 8px;
}
.panel-intro {
  color: var(--ivory-dim); max-width: 46ch; margin: 0 0 40px; font-size: 15px;
}

/* -- chapter nav list --------------------------------------------------- */
.chapter-list { list-style: none; margin: 0; padding: 0; }
.chapter-list li {
  border-top: 1px solid var(--line);
}
.chapter-list li:last-child { border-bottom: 1px solid var(--line); }
.chapter-link {
  display: flex; align-items: baseline; gap: 18px;
  width: 100%; text-align: left; padding: 18px 0;
  font-family: var(--f-display); font-size: clamp(19px, 4vw, 26px); font-weight: 400;
  color: var(--ivory-dim);
  transition: color var(--dur-fast) var(--ease-soft), padding-left var(--dur-fast) var(--ease-soft);
}
.chapter-link:hover, .chapter-link:focus-visible { color: var(--ivory); padding-left: 8px; }
.chapter-link .n {
  font-family: var(--f-mono); font-size: 12px; color: var(--brass); letter-spacing: 0.08em;
  min-width: 24px;
}

/* letters grid inside letters panel */
.letters-grid { display: grid; gap: 1px; background: var(--line); border: 1px solid var(--line); }
.letter-tile {
  background: var(--ink); padding: 22px 20px; text-align: left;
  display: flex; flex-direction: column; gap: 10px;
  transition: background var(--dur-fast) var(--ease-soft);
  position: relative;
}
.letter-tile:hover, .letter-tile:focus-visible { background: var(--ink-soft); }
.letter-tile .svg-icon { width: 26px; height: 20px; color: var(--brass); }
.letter-tile .trigger { font-family: var(--f-display); font-size: 17px; color: var(--ivory); }
.letter-tile .status { font-family: var(--f-mono); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ivory-faint); }
@media (min-width: 640px) {
  .letters-grid { grid-template-columns: 1fr 1fr; }
}

.letter-unlock {
  margin-top: 28px; padding: 24px 20px; border: 1px dashed var(--line-strong);
  display: flex; flex-direction: column; gap: 10px; align-items: flex-start;
}
.letter-unlock .status-note { font-family: var(--f-mono); font-size: 11px; color: var(--ivory-faint); }

/* -- letter reading modal ------------------------------------------------ */
.letter-modal {
  position: fixed; inset: 0; z-index: 120;
  display: flex; align-items: flex-end; justify-content: center;
  background: var(--overlay);
  opacity: 0; visibility: hidden;
  transition: opacity var(--dur-fast) var(--ease-soft), visibility 0s var(--dur-fast);
}
.letter-modal.is-open { opacity: 1; visibility: visible; transition: opacity var(--dur-fast) var(--ease-soft); }
.letter-sheet {
  width: 100%; max-width: 560px; max-height: 84vh;
  background: var(--ink-soft); border-top: 1px solid var(--line-strong);
  border-left: 1px solid var(--line); border-right: 1px solid var(--line);
  padding: 40px var(--edge) 44px;
  overflow-y: auto;
  transform: translateY(3%);
  transition: transform var(--dur-med) var(--ease-out);
}
.letter-modal.is-open .letter-sheet { transform: translateY(0); }
@media (min-width: 640px) {
  .letter-modal { align-items: center; }
  .letter-sheet { max-height: 78vh; border-radius: var(--radius); border: 1px solid var(--line-strong); }
}
.letter-sheet .close-row { display: flex; justify-content: flex-end; margin-bottom: 18px; }
.letter-sheet .trigger-title { font-family: var(--f-display); font-size: clamp(22px, 5vw, 30px); margin: 0 0 22px; color: var(--brass); }
.letter-sheet .body-text { font-size: 16.5px; line-height: 1.85; white-space: pre-line; color: var(--ivory); }
.letter-sheet .body-text::first-letter {
  font-family: var(--f-display); font-size: 2.6em; float: left; line-height: 0.8;
  padding: 6px 8px 0 0; color: var(--brass);
}

/* ==========================================================================
   SCENES / SECTIONS
   ========================================================================== */

.scene {
  min-height: 100svh;
  display: flex; flex-direction: column; justify-content: center;
  padding: var(--section-pad) var(--edge);
  position: relative;
}

.scene-inner { max-width: 640px; margin: 0 auto; width: 100%; }
.scene-inner.wide { max-width: 780px; }

.eyebrow {
  font-family: var(--f-mono); font-size: 11.5px; letter-spacing: 0.16em;
  text-transform: uppercase; color: var(--brass);
  display: flex; align-items: center; gap: 10px;
  margin-bottom: 18px;
}
.eyebrow::before { content: ""; width: 22px; height: 1px; background: var(--brass-dim); }

.headline {
  font-family: var(--f-display); font-weight: 500;
  font-size: clamp(30px, 7vw, 52px); line-height: 1.08;
  margin: 0 0 20px; letter-spacing: -0.01em;
}

.lede { color: var(--ivory-dim); font-size: 17px; line-height: 1.75; max-width: 52ch; }

.body-copy { font-size: 16.5px; line-height: 1.85; color: var(--ivory); }
.body-copy p { margin: 0 0 1.4em; }
.body-copy p:last-child { margin-bottom: 0; }

/* -- entry scene ------------------------------------------------------ */
#entry {
  align-items: center; text-align: center; justify-content: center;
  min-height: 100svh;
}
#entry .greeting {
  font-family: var(--f-display); font-weight: 400;
  font-size: clamp(34px, 9vw, 60px);
  opacity: 0; transform: translateY(14px);
}
.entry-lines { max-width: 46ch; margin: 26px auto 0; }
.entry-lines p {
  font-size: clamp(15px, 3.6vw, 18px); color: var(--ivory-dim);
  opacity: 0; transform: translateY(10px); margin: 0 0 1.1em;
}
.entry-cta {
  margin-top: 42px; opacity: 0;
  font-family: var(--f-mono); font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase;
  padding: 16px 40px; border: 1px solid var(--line-strong);
  color: var(--ivory); transition: border-color var(--dur-fast), background var(--dur-fast);
}
.entry-cta:hover, .entry-cta:focus-visible { border-color: var(--brass); background: rgba(184,147,95,0.06); }
.entry-sub { margin-top: 16px; opacity: 0; font-size: 12px; color: var(--ivory-faint); }

/* -- date + counter reveal --------------------------------------------- */
#reveal { align-items: center; text-align: center; }
.date-mark {
  font-family: var(--f-mono); font-size: clamp(30px, 9vw, 54px);
  letter-spacing: 0.08em; color: var(--ivory);
  cursor: pointer; position: relative; display: inline-block;
}
.date-caption { max-width: 40ch; margin: 20px auto 0; color: var(--ivory-dim); font-size: 15.5px; }
.counter-block { margin-top: clamp(56px, 10vh, 90px); }
.counter-intro { font-size: 15px; color: var(--ivory-dim); letter-spacing: 0.02em; }
.counter-number {
  font-family: var(--f-display); font-weight: 500; font-variant-numeric: tabular-nums;
  font-size: clamp(64px, 22vw, 148px); line-height: 1; margin: 10px 0;
  color: var(--ivory); cursor: pointer;
}
.counter-unit { font-family: var(--f-mono); font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--brass); }
.counter-sub { margin-top: 18px; color: var(--ivory-dim); font-size: 14.5px; }
.counter-breakdown {
  margin-top: 22px; font-family: var(--f-mono); font-size: 12.5px; color: var(--ivory-faint);
  display: flex; gap: 18px; justify-content: center; opacity: 0; max-height: 0; overflow: hidden;
  transition: opacity var(--dur-fast) var(--ease-soft), max-height var(--dur-fast) var(--ease-soft);
}
.counter-breakdown.is-shown { opacity: 1; max-height: 60px; margin-top: 22px; }
.whisper {
  margin-top: 14px; font-size: 12px; color: var(--brass); opacity: 0; max-height: 0; overflow: hidden;
  transition: opacity var(--dur-fast), max-height var(--dur-fast);
}
.whisper.is-shown { opacity: 1; max-height: 60px; }

/* -- little things list -------------------------------------------------- */
.little-list { margin-top: 40px; display: flex; flex-direction: column; }
.little-item {
  border-top: 1px solid var(--line);
  padding: 20px 0; display: flex; gap: 18px; align-items: flex-start;
  cursor: default;
}
.little-item:last-child { border-bottom: 1px solid var(--line); }
.little-item .idx { font-family: var(--f-mono); font-size: 11px; color: var(--brass-dim); padding-top: 4px; min-width: 20px; }
.little-item p { margin: 0; font-size: 16px; line-height: 1.7; }
.little-item .extra {
  display: block; margin-top: 10px; font-size: 13px; color: var(--brass);
  max-height: 0; opacity: 0; overflow: hidden; transition: max-height var(--dur-fast), opacity var(--dur-fast);
}
.little-item.is-open .extra { max-height: 80px; opacity: 1; }
.little-item[data-secret="true"] { cursor: pointer; }

/* -- memories --------------------------------------------------------- */
.memory-card {
  border: 1px solid var(--line); margin-top: 28px; padding: 26px;
  position: relative;
}
.memory-frame {
  aspect-ratio: 4/5; border: 1px dashed var(--line-strong);
  display: flex; align-items: center; justify-content: center; text-align: center;
  padding: 24px; margin-bottom: 20px; position: relative; overflow: hidden;
}
.memory-frame img { width: 100%; height: 100%; object-fit: cover; position: absolute; inset: 0; }
.memory-frame .placeholder-text { font-family: var(--f-display); font-style: italic; color: var(--ivory-faint); font-size: 15px; max-width: 22ch; }
.memory-frame .corner { position: absolute; width: 22px; height: 22px; color: var(--brass-dim); }
.memory-frame .corner.tl { top: 8px; left: 8px; }
.memory-frame .corner.tr { top: 8px; right: 8px; transform: scaleX(-1); }
.memory-frame .corner.bl { bottom: 8px; left: 8px; transform: scaleY(-1); }
.memory-frame .corner.br { bottom: 8px; right: 8px; transform: scale(-1,-1); }
.memory-card h3 { font-family: var(--f-display); font-size: 19px; margin: 0 0 8px; }
.memory-card .memory-date { font-family: var(--f-mono); font-size: 11px; color: var(--brass); letter-spacing: 0.08em; margin-bottom: 10px; display: block; }
.memory-card p { color: var(--ivory-dim); font-size: 14.5px; margin: 0; }

.video-block { margin-top: 44px; }
.video-frame {
  aspect-ratio: 9/13; max-height: 70vh; margin: 0 auto;
  border: 1px solid var(--line-strong); background: var(--ink-soft);
  display: flex; align-items: center; justify-content: center; position: relative;
}
.video-frame video { width: 100%; height: 100%; object-fit: cover; }
.video-frame .placeholder-text { font-family: var(--f-display); font-style: italic; color: var(--ivory-faint); font-size: 14px; text-align: center; max-width: 20ch; padding: 20px; }
.video-pre, .video-post { max-width: 46ch; margin: 18px auto; text-align: center; color: var(--ivory-dim); font-size: 14.5px; }

/* -- distance ----------------------------------------------------------- */
.paragraph-rhythm p {
  margin: 0 0 1.5em; font-size: 16.5px; line-height: 1.85;
}
.paragraph-rhythm p:nth-child(2) { font-family: var(--f-display); font-style: italic; font-size: 19px; color: var(--rose-ash); }

/* -- when you miss me (immersive sequence) ------------------------------ */
#missme { background: radial-gradient(ellipse at 50% 20%, #0d1220 0%, var(--ink) 62%); }
.sequence-wrap { min-height: 60vh; display: flex; align-items: center; justify-content: center; text-align: center; position: relative; }
.sequence-line {
  font-family: var(--f-display); font-size: clamp(20px, 5vw, 30px); font-weight: 400;
  max-width: 26ch; opacity: 0; transform: translateY(10px);
  transition: opacity 700ms var(--ease-out), transform 700ms var(--ease-out);
  position: absolute;
}
.sequence-line.is-active { opacity: 1; transform: translateY(0); position: relative; }
.sequence-progress { display: flex; gap: 6px; justify-content: center; margin-top: 40px; }
.sequence-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--line-strong); transition: background var(--dur-fast); }
.sequence-dot.is-done { background: var(--brass); }
.sequence-tap { margin-top: 26px; font-family: var(--f-mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ivory-faint); }

.constellation-wrap { margin-top: 56px; display: flex; justify-content: center; }
.constellation-hint { text-align: center; font-family: var(--f-mono); font-size: 11px; color: var(--ivory-faint); margin-top: 14px; }

/* -- difficult days ------------------------------------------------------- */
.difficult-grid { display: grid; gap: 1px; background: var(--line); border: 1px solid var(--line); margin-top: 36px; }
@media (min-width: 640px) { .difficult-grid { grid-template-columns: 1fr 1fr; } }
.difficult-option {
  background: var(--ink); padding: 22px; text-align: left;
  font-family: var(--f-display); font-size: 17px; color: var(--ivory);
  transition: background var(--dur-fast) var(--ease-soft);
}
.difficult-option:hover, .difficult-option:focus-visible { background: var(--ink-soft); }
.difficult-response {
  margin-top: 30px; padding: 28px; border-left: 2px solid var(--brass);
  background: var(--ink-soft); display: none;
}
.difficult-response.is-shown { display: block; }
.difficult-response p { font-size: 16px; line-height: 1.8; margin: 0 0 16px; }
.difficult-back { font-family: var(--f-mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--brass); display: inline-flex; align-items: center; gap: 8px; }

/* -- never said cards ----------------------------------------------------- */
.never-deck { margin-top: 40px; }
.never-card {
  border: 1px solid var(--line); padding: 34px 28px; min-height: 140px;
  display: flex; align-items: center; text-align: center; justify-content: center;
  cursor: pointer; user-select: none;
}
.never-card p {
  font-family: var(--f-display); font-size: clamp(17px, 4vw, 21px); line-height: 1.5; margin: 0;
}
.never-controls { display: flex; justify-content: space-between; align-items: center; margin-top: 20px; }
.never-progress { font-family: var(--f-mono); font-size: 11px; color: var(--ivory-faint); }
.never-nav { display: flex; gap: 14px; }
.never-nav button { font-family: var(--f-mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ivory-dim); padding: 10px 6px; }
.never-nav button:hover { color: var(--ivory); }

/* -- soundtrack ------------------------------------------------------------ */
.player {
  margin-top: 34px; border: 1px solid var(--line); padding: 26px; display: flex; align-items: center; gap: 18px;
}
.player-btn { width: 48px; height: 48px; flex-shrink: 0; }
.player-btn .svg-icon { width: 48px; height: 48px; color: var(--brass); }
.player-meta { flex: 1; }
.player-label { font-family: var(--f-mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--brass); margin-bottom: 4px; }
.player-track { font-family: var(--f-display); font-size: 16px; color: var(--ivory-dim); }
.player-bar { height: 1px; background: var(--line); margin-top: 12px; position: relative; }
.player-bar-fill { position: absolute; left: 0; top: 0; height: 1px; width: 0%; background: var(--brass); }
.soundtrack-reflection { margin-top: 24px; }

/* -- hidden chapter --------------------------------------------------------- */
#hidden .body-copy { position: relative; }
.footer-mark {
  margin-top: 60px; display: flex; justify-content: center; opacity: 0.5;
  cursor: pointer;
}
.footer-mark .svg-icon { width: 54px; height: 27px; color: var(--ivory-faint); }

/* -- future / final ------------------------------------------------------- */
.small-line {
  margin-top: 30px; font-family: var(--f-display); font-style: italic;
  font-size: clamp(19px, 4.5vw, 24px); color: var(--brass);
}
.continue-cta {
  margin-top: 50px; font-family: var(--f-mono); font-size: 12px; letter-spacing: 0.14em;
  text-transform: uppercase; color: var(--ivory-dim); display: inline-flex; align-items: center; gap: 10px;
}

/* -- final scene -------------------------------------------------------- */
#final {
  background: var(--ink); text-align: center; align-items: center;
}
#final .panel-eyebrow, #final .headline { text-align: center; }
.final-letter { text-align: left; max-width: 54ch; margin: 40px auto 0; }
.final-sign { margin-top: 30px; font-family: var(--f-display); font-style: italic; color: var(--ivory-dim); }
.final-closing {

.back-top { margin-top: 60px; font-family: var(--f-mono); font-size: 11px; color: var(--ivory-faint); letter-spacing: 0.1em; text-transform: uppercase; }

.lang-toggle {
  font-family: var(--f-mono); font-size: 11px; letter-spacing: 0.1em;
  border: 1px solid var(--line-strong); padding: 8px 12px; color: var(--ivory-dim);

}

/* ==========================================================================
   ANIMATIONS.CSS — reveal + motion, all restrained and purposeful.
   Respects prefers-reduced-motion throughout (see bottom of file).
   ========================================================================== */

/* -- scroll reveal: applied via IntersectionObserver in app.js -------- */
.reveal {
  opacity: 0;
  transform: translateY(22px);
  transition: opacity var(--dur-slow) var(--ease-out), transform var(--dur-slow) var(--ease-out);
}
.reveal.is-visible {
  opacity: 1;
  transform: translateY(0);
}
.reveal-delay-1 { transition-delay: 90ms; }
.reveal-delay-2 { transition-delay: 180ms; }
.reveal-delay-3 { transition-delay: 270ms; }
.reveal-delay-4 { transition-delay: 360ms; }

/* -- entry sequence (handled with explicit classes toggled by JS) ------- */
@keyframes rise-in {
  from { opacity: 0; transform: translateY(16px); }
  to   { opacity: 1; transform: translateY(0); }
}
.rise-in { animation: rise-in var(--dur-slow) var(--ease-out) forwards; }

/* -- fade only ---------------------------------------------------------- */
@keyframes fade-in {
  from { opacity: 0; }
  to   { opacity: 1; }
}
.fade-in { animation: fade-in var(--dur-med) var(--ease-soft) forwards; }

/* -- gentle drift for the constellation dots ---------------------------- */
@keyframes drift {
  0%, 100% { transform: translate(0, 0); }
  50%      { transform: translate(1.5px, -2px); }
}
.star-drift { animation: drift 9s ease-in-out infinite; }

/* -- subtle pulse for interactive hint dots ------------------------------ */
@keyframes soft-pulse {
  0%, 100% { opacity: 0.35; }
  50%      { opacity: 0.9; }
}
.soft-pulse { animation: soft-pulse 2.6s ease-in-out infinite; }

/* -- panel + modal open feel is handled with transitions in main.css --- */

/* -- entry sequence reveal (classes toggled by app.js) ------------------ */
#entry .greeting.in {
  opacity: 1; transform: translateY(0);
  transition: opacity var(--dur-slow) var(--ease-out), transform var(--dur-slow) var(--ease-out);
}
.entry-lines p.in {
  opacity: 1; transform: translateY(0);
  transition: opacity var(--dur-med) var(--ease-out), transform var(--dur-med) var(--ease-out);
}
.entry-cta.in {
  opacity: 1;
  transition: opacity var(--dur-med) var(--ease-out);
}
.entry-sub.in {
  opacity: 1;
  transition: opacity var(--dur-med) var(--ease-out);
}

/* -- missme sequence line swap ------------------------------------------ */
.sequence-line { position: absolute; }
.sequence-line.is-active { position: relative; }

/* -- reduced motion --------------------------------------------------- */
@media (prefers-reduced-motion: reduce) {
  * , *::before, *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
    scroll-behavior: auto !important;
  }
  .reveal { opacity: 1 !important; transform: none !important; }
}


/* ==========================================================================
   RESPONSIVE.CSS
   Mobile is the primary design target (see main.css defaults).
   This file adds refinements for larger viewports and safe-area handling.
   ========================================================================== */

/* -- safe area (notches, home indicators) ------------------------------- */
.topbar {
  padding-top: max(18px, env(safe-area-inset-top));
  padding-left: max(var(--edge), env(safe-area-inset-left));
  padding-right: max(var(--edge), env(safe-area-inset-right));
}
.scene {
  padding-left: max(var(--edge), env(safe-area-inset-left));
  padding-right: max(var(--edge), env(safe-area-inset-right));
  padding-bottom: max(var(--section-pad), env(safe-area-inset-bottom));
}
.letter-sheet { padding-bottom: max(44px, env(safe-area-inset-bottom)); }

/* -- small phones ------------------------------------------------------- */
@media (max-width: 380px) {
  :root { --edge: 16px; }
  .counter-number { font-size: 58px; }
}

/* -- tablet -------------------------------------------------------------- */
@media (min-width: 720px) {
  :root { --edge: 64px; }
  .scene-inner { max-width: 700px; }
  .scene-inner.wide { max-width: 860px; }
}

/* -- desktop / adaptive --------------------------------------------------
   The experience remains a single vertical column by design — this is a
   personal, intimate, story-first piece, not a dashboard. On wide
   viewports we simply widen margins and cap line length rather than
   introducing multi-column layouts that would break the pacing.        */
@media (min-width: 1024px) {
  :root { --edge: 12vw; }
  body { font-size: 16.5px; }
  .scene { min-height: 100vh; }
  #entry, #reveal { min-height: 100vh; }
}

@media (min-width: 1400px) {
  :root { --edge: 18vw; }
}

/* -- landscape phones: shrink vertical rhythm so content isn't starved -- */
@media (max-height: 480px) and (orientation: landscape) {
  :root { --section-pad: 48px; }
  .counter-number { font-size: 15vw; }
  .sequence-wrap { min-height: 40vh; }
}

/* -- print (just in case) ------------------------------------------------ */
@media print {
  .topbar, .ledger, .grain, .vignette, .panel, .letter-modal { display: none !important; }
}

/* ==========================================================================
   COUNTER.JS
   Calculates days (and, on request, hours/minutes/seconds) between
   RELATIONSHIP_START (see content.js) and right now. Never hard-coded —
   recalculated every tick, so it rolls over automatically at midnight.
   ========================================================================== */

const Counter = (() => {
  function diffParts(from, to) {
    let ms = to - from;
    if (ms < 0) ms = 0;
    const totalSeconds = Math.floor(ms / 1000);
    const days = Math.floor(totalSeconds / 86400);
    const hours = Math.floor((totalSeconds % 86400) / 3600);
    const minutes = Math.floor((totalSeconds % 3600) / 60);
    const seconds = totalSeconds % 60;
    return { days, hours, minutes, seconds, totalSeconds };
  }

  function days() {
    return diffParts(RELATIONSHIP_START, new Date()).days;
  }

  function full() {
    return diffParts(RELATIONSHIP_START, new Date());
  }

  return { days, full };
})();

/* ==========================================================================
   MUSIC.JS
   Minimal player for the "Our Soundtrack" chapter. Points at
   MUSIC_TRACK (see content.js). If the file isn't there yet, the button
   still works visually but simply won't produce sound — no console-error
   spam, no broken UI.
   ========================================================================== */

const MusicPlayer = (() => {
  let audio, btn, barFill, playing = false, raf;

  function init() {
    audio = document.getElementById('audioEl');
    btn = document.getElementById('playerBtn');
    barFill = document.getElementById('playerBarFill');
    audio.src = MUSIC_TRACK;

    btn.addEventListener('click', toggle);
    audio.addEventListener('ended', () => setPlaying(false));
  }

  function toggle() {
    if (playing) {
      audio.pause();
      setPlaying(false);
    } else {
      const p = audio.play();
      if (p && p.catch) p.catch(() => { /* file not added yet — fail silently */ });
      setPlaying(true);
      tick();
    }
  }

  function setPlaying(state) {
    playing = state;
    btn.querySelector('.svg-icon').innerHTML = playing ? ICONS.pause : ICONS.play;
    if (!playing) cancelAnimationFrame(raf);
  }

  function tick() {
    if (!playing) return;
    if (audio.duration) {
      barFill.style.width = ((audio.currentTime / audio.duration) * 100) + '%';
    }
    raf = requestAnimationFrame(tick);
  }

  return { init };
})();

     4. The constellation (Ch. 05)       -> tap every star to light it fully
     5. The footer mark (Ch. 09)         -> tap for a hidden note
     6. Long-press the final closing line -> reveals a hidden P.S.
   The larger secret:
     7. Opening all 11 "Open When" letters unlocks a 12th, hidden letter.
   ========================================================================== */

const EasterEggs = (() => {
  const state = { openedLetters: new Set() };

  function longPress(el, callback, ms = 650) {
    let timer = null;
    const start = () => { timer = setTimeout(callback, ms); };
    const cancel = () => { if (timer) clearTimeout(timer); };
    el.addEventListener('pointerdown', start);
    el.addEventListener('pointerup', cancel);
    el.addEventListener('pointerleave', cancel);
    el.addEventListener('pointercancel', cancel);
  }

  function multiTap(el, count, windowMs, callback) {
    let taps = 0, timer = null;
    el.addEventListener('click', () => {
      taps++;
      clearTimeout(timer);
      timer = setTimeout(() => { taps = 0; }, windowMs);
      if (taps >= count) { taps = 0; callback(); }
    });
  }

  function wireDateWhisper(lang) {
    const dateEl = document.getElementById('dateMark');
    const whisperEl = document.getElementById('dateWhisper');
    whisperEl.textContent = TRANSLATIONS[lang].easter.dateWhisper;
    longPress(dateEl, () => whisperEl.classList.add('is-shown'));
  }

  function wireCounterSecret(lang, getFull) {
    const counterEl = document.getElementById('counterNumber');
    const breakdown = document.getElementById('counterBreakdown');
    const whisperEl = document.getElementById('counterWhisper');
    whisperEl.textContent = TRANSLATIONS[lang].easter.counterWhisper;

    const reveal = () => {
      const f = getFull();
      breakdown.innerHTML = `<span>${f.hours}h</span><span>${f.minutes}m</span><span>${f.seconds}s</span>`;
      breakdown.classList.add('is-shown');
      whisperEl.classList.add('is-shown');
    };
    multiTap(counterEl, 3, 900, reveal);
    counterEl.addEventListener('keydown', (e) => { if (e.key === 'Enter') reveal(); });
  }

  function wireLittleSecret(lang) {
    const items = document.querySelectorAll('.little-item[data-secret="true"]');
    items.forEach(item => {
      item.addEventListener('click', () => item.classList.toggle('is-open'));
    });
  }

  function wireFooterSecret(lang) {
    const mark = document.getElementById('footerMark');
    const whisper = document.getElementById('footerWhisper');
    whisper.textContent = TRANSLATIONS[lang].easter.footerSecret;
    mark.addEventListener('click', () => {
      whisper.classList.add('is-shown');
      mark.style.opacity = '1';
    });
  }

  function wireFinalPS(lang) {
    const closing = document.getElementById('finalClosing');
    const ps = document.getElementById('finalPs');
    ps.textContent = TRANSLATIONS[lang].final.hiddenPS;
    longPress(closing, () => ps.classList.add('is-shown'));
  }

  function buildConstellation(lang) {
    const wrap = document.getElementById('constellationWrap');
    const hint = document.getElementById('constellationHint');
    hint.textContent = TRANSLATIONS[lang].chapters.missme.constellationHint;

    const positions = [
      [30, 60], [90, 20], [150, 70], [210, 15], [270, 55], [330, 30]
    ];
    const svgW = 360, svgH = 100;
    let lit = 0;

    let svg = `<svg viewBox="0 0 ${svgW} ${svgH}" width="100%" style="max-width:360px" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">`;
    positions.forEach((p, i) => {
      svg += `<circle class="const-star" data-i="${i}" cx="${p[0]}" cy="${p[1]}" r="3" fill="var(--ivory-faint)" style="cursor:pointer;transition:fill 300ms;" />`;
    });
    svg += `</svg>`;
    wrap.innerHTML = svg;

    const stars = wrap.querySelectorAll('.const-star');
    const litSet = new Set();
    stars.forEach(star => {
      star.addEventListener('click', () => {
        litSet.add(star.dataset.i);
        star.setAttribute('fill', 'var(--brass)');
        star.classList.add('star-drift');
        if (litSet.size === positions.length) {
          hint.textContent = TRANSLATIONS[lang].easter.footerSecret === undefined ? hint.textContent : hint.textContent;
          hint.style.color = 'var(--brass)';
        }
      });
    });
  }

  function wireLetters(lang, onUnlockRender) {
    state.openedLetters.clear();
    const letters = TRANSLATIONS[lang].letters.list;
    return {
      markOpened(id) {
        state.openedLetters.add(id);
        if (state.openedLetters.size === letters.length) {
          onUnlockRender();
        }
      },
      isAllOpened() { return state.openedLetters.size === letters.length; }
    };
  }

  function init(lang, getFull) {
    wireDateWhisper(lang);
    wireCounterSecret(lang, getFull);
    wireLittleSecret(lang);
    wireFooterSecret(lang);
    wireFinalPS(lang);
    buildConstellation(lang);
  }

  return { init, wireLetters, state };
})();


/* ==========================================================================
   APP.JS
   Orchestrates everything: language state, rendering all copy from
   translations.js, panel/modal behaviour, chapter-level interactions,
   scroll reveal, and the ledger progress line.
   ========================================================================== */

(function () {
  const STORAGE_KEY = 'love-experience-lang';
  let lang = detectInitialLang();
  let letterTracker = null;
  let neverIndex = 0;

  /* ---------------------------------------------------------------- init */
  document.addEventListener('DOMContentLoaded', () => {
    document.documentElement.lang = lang;
    mountIcons();
    renderAll();
    wireGlobalUI();
    wireEntrySequence();
    wireMissMeSequence();
    wireReveal();
    wireLedger();
    MusicPlayer.init();
    letterTracker = EasterEggs.wireLetters(lang, showUnlockedLetter);
    EasterEggs.init(lang, () => Counter.full());
    tickCounter();
    setInterval(tickCounter, 1000);
  });

  function detectInitialLang() {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved === 'en' || saved === 'fr') return saved;
    const nav = (navigator.language || 'en').toLowerCase();
    return nav.startsWith('fr') ? 'fr' : 'en';
  }

  function t() { return TRANSLATIONS[lang]; }

  /* --------------------------------------------------------- rendering */
  function renderAll() {
    document.title = t().meta.title;
    document.documentElement.lang = lang;
    document.getElementById('langToggleBtn').textContent = t().ui.langToggle;

    renderEntry();
    renderReveal();
    renderNav();
    renderChapterBeginning();
    renderChapterLittle();
    MemoriesView.render(lang);
    renderChapterDistance();
    renderChapterMissMe();
    renderChapterDifficult();
    renderChapterNeverSaid();
    renderChapterSoundtrack();
    renderChapterHidden();
    renderChapterFuture();
    renderFinal();
    renderLetters();
  }

  function renderEntry() {
    const e = t().entry;
    document.getElementById('entryGreeting').textContent = e.greeting;
    const linesWrap = document.getElementById('entryLines');
    linesWrap.innerHTML = '';
    e.lines.forEach(line => {
      const p = document.createElement('p');
      p.textContent = line;
      linesWrap.appendChild(p);
    });
    document.getElementById('entryCta').textContent = e.cta;
    document.getElementById('entrySub').textContent = e.sub;
  }

  function renderReveal() {
    const r = t().reveal;
    document.getElementById('dateMark').textContent = r.dateLabel;
    document.getElementById('dateCaption').textContent = r.dateCaption;
    document.getElementById('counterIntro').textContent = r.counterIntro;
    document.getElementById('counterUnit').textContent = r.counterUnit;
    document.getElementById('counterSub').textContent = r.counterSub;
  }

  function renderNav() {
    const list = document.getElementById('chapterList');
    list.innerHTML = '';
    t().nav.chapters.forEach(ch => {
      const li = document.createElement('li');
      const btn = document.createElement('button');
      btn.className = 'chapter-link bare';
      btn.innerHTML = `<span class="n">${ch.n}</span><span>${ch.title}</span>`;
      btn.addEventListener('click', () => {
        closePanel('navPanel');
        scrollToId(ch.id);
      });
      li.appendChild(btn);
      list.appendChild(li);
    });
    document.querySelector('#navPanel .panel-eyebrow').textContent = lang === 'fr' ? 'index' : 'index';
  }

  function renderChapterBeginning() {
    const c = t().chapters.beginning;
    document.getElementById('beginningEyebrow').textContent = c.eyebrow;
    document.getElementById('beginningTitle').textContent = c.title;
    document.getElementById('beginningBody').innerHTML = `<p>${c.body}</p>`;
  }

  function renderChapterLittle() {
    const c = t().chapters.little;
    document.getElementById('littleEyebrow').textContent = c.eyebrow;
    document.getElementById('littleTitle').textContent = c.title;
    document.getElementById('littleIntro').textContent = c.intro;
    const list = document.getElementById('littleList');
    list.innerHTML = '';
    c.items.forEach((item, i) => {
      const isSecret = i === 3; // one item carries a hidden second line
      const div = document.createElement('div');
      div.className = 'little-item reveal';
      div.dataset.secret = isSecret ? 'true' : 'false';
      div.innerHTML = `
        <span class="idx">${String(i + 1).padStart(2, '0')}</span>
        <div>
          <p>${item}</p>
          ${isSecret ? `<span class="extra">${c.hiddenExtra}</span>` : ''}
        </div>`;
      list.appendChild(div);
    });
  }

  function renderChapterDistance() {
    const c = t().chapters.distance;
    document.getElementById('distanceEyebrow').textContent = c.eyebrow;
    document.getElementById('distanceTitle').textContent = c.title;
    document.getElementById('distanceBody').innerHTML = c.paragraphs.map(p => `<p>${p}</p>`).join('');
  }

  let missMeLines = [], missMeIndex = 0;
  function renderChapterMissMe() {
    const c = t().chapters.missme;
    document.getElementById('missmeEyebrow').textContent = c.eyebrow;
    document.getElementById('missmeTitle').textContent = c.title;
    missMeLines = c.sequence;
    missMeIndex = 0;
    const wrap = document.getElementById('sequenceWrap');
    wrap.innerHTML = missMeLines.map((line, i) =>
      `<p class="sequence-line${i === 0 ? ' is-active' : ''}">${line}</p>`).join('');
    const progress = document.getElementById('sequenceProgress');
    progress.innerHTML = missMeLines.map((_, i) =>
      `<span class="sequence-dot${i === 0 ? ' is-done' : ''}"></span>`).join('');
    document.getElementById('sequenceTap').textContent = lang === 'fr' ? 'toucher pour continuer' : 'tap to continue';
  }

  function renderChapterDifficult() {
    const c = t().chapters.difficult;
    document.getElementById('difficultEyebrow').textContent = c.eyebrow;
    document.getElementById('difficultTitle').textContent = c.title;
    document.getElementById('difficultIntro').textContent = c.intro;
    const grid = document.getElementById('difficultGrid');
    grid.innerHTML = '';
    const responseBox = document.getElementById('difficultResponse');
    responseBox.classList.remove('is-shown');
    responseBox.innerHTML = '';

    c.options.forEach(opt => {
      const btn = document.createElement('button');
      btn.className = 'difficult-option bare';
      btn.textContent = opt.title;
      btn.addEventListener('click', () => {
        responseBox.innerHTML = `<p>${opt.response}</p><button class="difficult-back bare" id="difficultBackBtn">${c.backHint}</button>`;
        responseBox.classList.add('is-shown');
        document.getElementById('difficultBackBtn').addEventListener('click', () => {
          responseBox.classList.remove('is-shown');
        });
        responseBox.scrollIntoView({ behavior: 'smooth', block: 'center' });
      });
      grid.appendChild(btn);
    });
  }

  function renderChapterNeverSaid() {
    const c = t().chapters.neversaid;
    document.getElementById('neversaidEyebrow').textContent = c.eyebrow;
    document.getElementById('neversaidTitle').textContent = c.title;
    document.getElementById('neversaidIntro').textContent = c.intro;
    neverIndex = 0;
    renderNeverCard();
    document.getElementById('neverPrev').onclick = () => {
      neverIndex = (neverIndex - 1 + c.items.length) % c.items.length;
      renderNeverCard();
    };
    document.getElementById('neverNext').onclick = () => {
      neverIndex = (neverIndex + 1) % c.items.length;
      renderNeverCard();
    };
    document.getElementById('neverCard').onclick = () => {
      neverIndex = (neverIndex + 1) % c.items.length;
      renderNeverCard();
    };
  }
  function renderNeverCard() {
    const c = t().chapters.neversaid;
    document.getElementById('neverCardText').textContent = c.items[neverIndex];
    document.getElementById('neverProgress').textContent = `${String(neverIndex + 1).padStart(2, '0')} / ${String(c.items.length).padStart(2, '0')}`;
  }

  function renderChapterSoundtrack() {
    const c = t().chapters.soundtrack;
    document.getElementById('soundtrackEyebrow').textContent = c.eyebrow;
    document.getElementById('soundtrackTitle').textContent = c.title;
    document.getElementById('soundtrackIntro').textContent = c.intro;
    document.getElementById('playerLabel').textContent = c.label;
    document.getElementById('playerTrack').textContent = c.placeholder;
    document.getElementById('soundtrackReflection').textContent = c.reflection;
  }

  function renderChapterHidden() {
    const c = t().chapters.hidden;
    document.getElementById('hiddenEyebrow').textContent = c.eyebrow;
    document.getElementById('hiddenTitle').textContent = c.title;
    document.getElementById('hiddenBody').innerHTML = `<p>${c.body}</p>`;
  }

  function renderChapterFuture() {
    const c = t().chapters.future;
    document.getElementById('futureEyebrow').textContent = c.eyebrow;
    document.getElementById('futureTitle').textContent = c.title;
    document.getElementById('futureBody').innerHTML = `<p>${c.body}</p>`;
    document.getElementById('futureSmallLine').textContent = c.smallLine;
    const btn = document.getElementById('continueBtn');
    btn.textContent = c.continue + ' ↓';
    btn.onclick = () => scrollToId('final');
  }

  function renderFinal() {
    const f = t().final;
    document.getElementById('finalEyebrow').textContent = lang === 'fr' ? 'lettre finale' : 'final letter';
    document.getElementById('finalTitle').textContent = f.title;
    document.getElementById('finalBody').innerHTML = f.paragraphs.map(p => `<p>${p}</p>`).join('');
    document.getElementById('finalSign').textContent = f.sign;
    document.getElementById('finalClosing').textContent = f.closingLine;
    document.getElementById('finalPs').textContent = f.hiddenPS;
    document.getElementById('finalPs').classList.remove('is-shown');
    document.getElementById('backTopBtn').textContent = t().ui.backToTop;
    document.getElementById('backTopBtn').onclick = () => scrollToId('entry');
  }

  function renderLetters() {
    const l = t().letters;
    document.getElementById('lettersEyebrow').textContent = lang === 'fr' ? 'ouvre quand...' : 'open when...';
    document.getElementById('lettersTitle').textContent = l.title;
    document.getElementById('lettersIntro').textContent = l.intro;
    const grid = document.getElementById('lettersGrid');
    grid.innerHTML = '';
    l.list.forEach(letter => {
      const btn = document.createElement('button');
      btn.className = 'letter-tile bare';
      btn.innerHTML = `<span class="svg-icon">${ICONS.envelope}</span>
        <span class="trigger">${letter.trigger}</span>
        <span class="status" data-letter-status="${letter.id}"></span>`;
      btn.addEventListener('click', () => openLetter(letter));
      grid.appendChild(btn);
    });
    document.getElementById('letterUnlock').style.display = 'none';
    document.getElementById('unlockTrigger').textContent = l.unlockAll;
    document.getElementById('unlockStatus').textContent = lang === 'fr' ? 'verrouillé' : 'locked';
  }

  function openLetter(letter) {
    document.getElementById('letterModalTitle').textContent = letter.trigger;
    document.getElementById('letterModalBody').textContent = letter.body;
    openModal('letterModal');
    if (letterTracker) {
      letterTracker.markOpened(letter.id);
      const statusEl = document.querySelector(`[data-letter-status="${letter.id}"]`);
      if (statusEl) statusEl.textContent = lang === 'fr' ? 'ouverte' : 'opened';
    }
  }

  function showUnlockedLetter() {
    const box = document.getElementById('letterUnlock');
    box.style.display = 'flex';
    box.querySelector('#unlockStatus').textContent = lang === 'fr' ? 'touche pour ouvrir' : 'tap to open';
    box.style.cursor = 'pointer';
    box.onclick = () => {
      const l = t().letters;
      document.getElementById('letterModalTitle').textContent = l.unlockAll;
      document.getElementById('letterModalBody').textContent = l.unlockAllBody;
      openModal('letterModal');
    };
  }

  /* --------------------------------------------------------- counter tick */
  function tickCounter() {
    const full = Counter.full();
    document.getElementById('counterNumber').textContent = full.days;
  }

  /* --------------------------------------------------------- entry motion */
  function wireEntrySequence() {
    const greeting = document.getElementById('entryGreeting');
    const lines = () => Array.from(document.querySelectorAll('.entry-lines p'));
    const cta = document.getElementById('entryCta');
    const sub = document.getElementById('entrySub');

    setTimeout(() => greeting.classList.add('in'), 250);
    setTimeout(() => {
      lines().forEach((p, i) => setTimeout(() => p.classList.add('in'), i * 500));
    }, 950);
    const linesDelay = 950 + lines().length * 500 + 300;
    setTimeout(() => cta.classList.add('in'), linesDelay);
    setTimeout(() => sub.classList.add('in'), linesDelay + 250);

    cta.addEventListener('click', () => scrollToId('reveal'));
  }

  /* ------------------------------------------------- when-you-miss-me seq */
  function wireMissMeSequence() {
    const wrap = document.getElementById('sequenceWrap');
    wrap.addEventListener('click', advanceMissMe);
  }
  function advanceMissMe() {
    const lines = document.querySelectorAll('.sequence-line');
    const dots = document.querySelectorAll('.sequence-dot');
    if (missMeIndex >= lines.length - 1) return;
    lines[missMeIndex].classList.remove('is-active');
    missMeIndex++;
    lines[missMeIndex].classList.add('is-active');
    if (dots[missMeIndex]) dots[missMeIndex].classList.add('is-done');
  }

  /* ------------------------------------------------------- scroll reveal */
  function wireReveal() {
    const els = document.querySelectorAll('.reveal');
    if (!('IntersectionObserver' in window)) {
      els.forEach(el => el.classList.add('is-visible'));
      return;
    }
    const io = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('is-visible');
          io.unobserve(entry.target);
        }
      });
    }, { threshold: 0.15, rootMargin: '0px 0px -8% 0px' });
    els.forEach(el => io.observe(el));
  }

  /* ------------------------------------------------------------- ledger */
  function wireLedger() {
    const fill = document.getElementById('ledgerFill');
    if (!fill) return;
    const update = () => {
      const doc = document.documentElement;
      const scrollTop = window.scrollY || doc.scrollTop;
      const height = doc.scrollHeight - window.innerHeight;
      const pct = height > 0 ? Math.min(100, (scrollTop / height) * 100) : 0;
      fill.style.height = pct + '%';
    };
    window.addEventListener('scroll', update, { passive: true });
    window.addEventListener('resize', update);
    update();
  }

  /* --------------------------------------------------------- panels/ui */
  function wireGlobalUI() {
    document.getElementById('navOpenBtn').addEventListener('click', () => openPanel('navPanel'));
    document.getElementById('navCloseBtn').addEventListener('click', () => closePanel('navPanel'));
    document.getElementById('lettersOpenBtn').addEventListener('click', () => openPanel('lettersPanel'));
    document.getElementById('lettersCloseBtn').addEventListener('click', () => closePanel('lettersPanel'));
    document.getElementById('letterModalCloseBtn').addEventListener('click', () => closeModal('letterModal'));
    document.getElementById('letterModal').addEventListener('click', (e) => {
      if (e.target.id === 'letterModal') closeModal('letterModal');
    });
    document.getElementById('langToggleBtn').addEventListener('click', switchLang);

    ['iconCloseNav', 'iconCloseLetters', 'iconCloseModal'].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.innerHTML = ICONS.close;
    });
    document.getElementById('iconPlay').innerHTML = ICONS.play;
  }

  function switchLang() {
    lang = lang === 'en' ? 'fr' : 'en';
    localStorage.setItem(STORAGE_KEY, lang);
    renderAll();
    letterTracker = EasterEggs.wireLetters(lang, showUnlockedLetter);
    EasterEggs.init(lang, () => Counter.full());
  }

  function openPanel(id) {
    const el = document.getElementById(id);
    el.classList.add('is-open');
    el.setAttribute('aria-hidden', 'false');
  }
  function closePanel(id) {
    const el = document.getElementById(id);
    el.classList.remove('is-open');
    el.setAttribute('aria-hidden', 'true');
  }
  function openModal(id) {
    const el = document.getElementById(id);
    el.classList.add('is-open');
    el.setAttribute('aria-hidden', 'false');
  }
  function closeModal(id) {
    const el = document.getElementById(id);
    el.classList.remove('is-open');
    el.setAttribute('aria-hidden', 'true');
  }
  function scrollToId(id) {
    const el = document.getElementById(id);
    if (el) el.scrollIntoView({ behavior: 'smooth' });
  }
})();

</script>
